services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: support_inbox
      POSTGRES_USER: support_inbox
      POSTGRES_PASSWORD: support_inbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_inbox -d support_inbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
