services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: support_inbox
      POSTGRES_USER: support_inbox
      POSTGRES_PASSWORD: support_inbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_inbox -d support_inbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the backend in a container instead of `./mvnw spring-boot:run`.
  # Secrets come from a gitignored .env in this directory (see .env.example).
  # Unset values start the container empty and the app refuses to boot (fail fast).
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/support_inbox
      DATABASE_USERNAME: support_inbox
      DATABASE_PASSWORD: support_inbox
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL_CLASSIFY: ${AI_MODEL_CLASSIFY:-}
      AI_MODEL_REPLY: ${AI_MODEL_REPLY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-10}

volumes:
  postgres-data:
