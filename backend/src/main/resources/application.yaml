spring:
  application:
    name: support-inbox
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_inbox}
    username: ${DATABASE_USERNAME:support_inbox}
    password: ${DATABASE_PASSWORD:support_inbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
