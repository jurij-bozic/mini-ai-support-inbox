spring:
  application:
    name: support-inbox
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_inbox}
    username: ${DATABASE_USERNAME:support_inbox}
    password: ${DATABASE_PASSWORD:support_inbox}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY}
    classify-model: ${AI_MODEL_CLASSIFY}
    reply-model: ${AI_MODEL_REPLY}
    connect-timeout: 5s
    read-timeout: 15s
    retry-backoff: 500ms
    classify-max-tokens: 50
    reply-max-tokens: 600

management:
  endpoints:
    web:
      exposure:
        include: health
